# Publish to PyPI on a version tag, via Trusted Publishing (OIDC — no API token stored).
# One-time setup on PyPI: add a "pending publisher" for project `cli-bridge-mcp`, repo
# JoaoBerne/cli-bridge-mcp, workflow `release.yml`, environment `pypi`. Then `git tag v0.1.0 &&
# git push --tags` builds + publishes automatically.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The tests workflow only runs on PRs — without this gate a tag would publish a commit
      # the CI never exercised. Also refuse a tag that doesn't match pyproject's version.
      - name: Run the test suite (publish gate)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-asyncio
          CLI_BRIDGE_STATE_DB="$RUNNER_TEMP/state.sqlite" python -m pytest -q
      - name: Check tag matches pyproject version
        run: |
          V=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != pyproject $V"; exit 1; }
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Smoke-check the wheel imports + entry points
        run: |
          python -m pip install dist/*.whl
          python -c "import cli_bridge, cli_bridge.cli, cli_bridge.server; print('import ok')"
          cli-bridge --help >/dev/null && echo "cli-bridge entry ok"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
