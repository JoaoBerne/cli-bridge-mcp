# Publish to PyPI + the official MCP registry on a version tag — both via OIDC, no API token stored.
# One-time setup on PyPI: add a "pending publisher" for project `cli-bridge-mcp`, repo
# JoaoBerne/cli-bridge-mcp, workflow `release.yml`, environment `pypi`. The registry step needs no
# setup: GitHub OIDC authenticates the `io.github.JoaoBerne` namespace from this repo automatically.
# Then `git tag v0.1.0 && git push --tags` builds, publishes to PyPI, and registers automatically.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The tests workflow only runs on PRs — without this gate a tag would publish a commit
      # the CI never exercised. Also refuse a tag that doesn't match pyproject's version.
      - name: Run the test suite (publish gate)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-asyncio
          CLI_BRIDGE_STATE_DB="$RUNNER_TEMP/state.sqlite" python -m pytest -q
      - name: Check tag matches pyproject version
        run: |
          V=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != pyproject $V"; exit 1; }
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Smoke-check the wheel imports + entry points
        run: |
          python -m pip install dist/*.whl
          python -c "import cli_bridge, cli_bridge.cli, cli_bridge.server; print('import ok')"
          cli-bridge --help >/dev/null && echo "cli-bridge entry ok"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Register the same version on the official MCP registry. Runs AFTER PyPI because the registry
  # validates the `mcp-name` marker in server.json against the PUBLISHED PyPI README. GitHub OIDC
  # (id-token) authenticates the io.github.<owner> namespace — no interactive `mcp-publisher login`.
  registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.7.9
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz mcp-publisher
      - name: Wait for PyPI to index this version
        run: |
          V=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          for i in $(seq 1 30); do
            curl -fsS "https://pypi.org/pypi/cli-bridge-mcp/$V/json" >/dev/null && { echo "PyPI $V is live"; exit 0; }
            echo "waiting for PyPI $V to index ($i/30)"; sleep 10
          done
          echo "PyPI $V not visible after 5 min — aborting registry publish"; exit 1
      - name: Publish to the MCP registry (GitHub OIDC)
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
