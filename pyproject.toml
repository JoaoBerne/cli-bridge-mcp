[project]
name = "cli-bridge-mcp"
version = "0.1.5"
description = "Consult a council of AI CLIs (Gemini, GPT, Claude, Mistral, Qwen, Copilot, OpenCode…) from inside any MCP client — free and ban-safe."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "JoaoBerné" }]
keywords = ["mcp", "claude", "claude-code", "ai", "cli", "gemini", "codex", "gpt",
            "mistral", "qwen", "copilot", "opencode", "multi-model", "second-opinion"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
# Upper bound is load-bearing, not caution: mcp 2.0.0 REMOVED the low-level decorators this
# server is built on (@server.list_tools/call_tool/list_prompts/get_prompt/list_resources/
# read_resource all gone, replaced by add_request_handler/middleware; mcp.server.fastmcp deleted).
# Without the cap a fresh install resolves to 2.x and every tool call dies with
# "'Server' object has no attribute 'list_tools'". Verified: 1.29.0 (last 1.x) is fully green.
dependencies = ["mcp>=1.2.0,<2"]

[project.urls]
Homepage = "https://github.com/JoaoBerne/cli-bridge-mcp"
Issues = "https://github.com/JoaoBerne/cli-bridge-mcp/issues"

[project.scripts]
cli-bridge-mcp = "cli_bridge.server:main"
cli-bridge = "cli_bridge.cli:main"
cli-bridge-openai = "cli_bridge.bridges.openai_compatible:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli_bridge"]

# Ship a lean source dist: the importable package + license/readme/changelog only. Excludes the
# test suite (its identity-guard test lists the very banned-name tokens it forbids — keeping it out
# of the published artifact avoids re-publishing them), plus docs/site/assets/examples that aren't
# needed to build or install. CI runs the tests from the checkout, not from the sdist.
[tool.hatch.build.targets.sdist]
exclude = ["/tests", "/docs", "/site", "/assets", "/examples", "/.github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# pyflakes (F), pycodestyle (E/W), isort (I), bugbear (B), pyupgrade (UP).
select = ["E", "F", "W", "I", "B", "UP"]
# E741: short loop vars are fine in tight comprehensions; B008: argparse default patterns.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# tests may shadow/leave locals and use bare asserts freely.
"tests/*" = ["F841", "B011"]

[tool.mypy]
# Static type gate over the package (CI pins the mypy version so it can't drift).
python_version = "3.10"          # check against the minimum supported runtime
files = ["src/cli_bridge"]

[[tool.mypy.overrides]]
# The MCP SDK's published types are incomplete in spots; never let a stub gap fail the gate.
module = "mcp.*"
ignore_missing_imports = true
